<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        background: transparent;
      }
      /* The page background of the Neutral theme (--color-background-body),
         painted before the app's CSS loads. Only Windows shows its Mica
         backdrop instead. */
      html:not([data-backdrop="mica"]) {
        background: light-dark(#f1f1f1, #1b1b1b);
      }
    </style>
    <script>
      (() => {
        const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        if (navigator.userAgent.includes("Windows")) {
          document.documentElement.dataset.backdrop = "mica";
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowqore Studio</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
