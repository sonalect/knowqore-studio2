# markdownlint-cli2 config (https://github.com/DavidAnson/markdownlint-cli2)
config:
  default: true
  # READMEs and design docs wrap poorly in tables / long URLs.
  MD013: false
  # Allow HTML in docs if needed later.
  MD033: false
  # Headings may repeat under different parents.
  MD024:
    siblings_only: true
  # Design docs use compact GFM separator rows (`|---|---|`).
  MD060: false

globs:
  - "**/*.md"

ignores:
  - "**/node_modules/**"
  - "dist/**"
  - "src-tauri/target/**"
  - "src-tauri/gen/**"
  # The agent's Knowqore signals: one line per entry, not tracked.
  - "dogfood/**"
  # Written by `astryx init` and rewritten by `astryx upgrade`.
  - ".claude/rules/astryx.md"
