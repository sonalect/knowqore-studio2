[package]
name = "knowqore-studio"
version = "0.1.0"
description = "A Tauri App"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "knowqore_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# Denied by default. Only the native Windows modules may use `unsafe`
# (`snap_layout.rs` for Snap Layouts, `system_appearance.rs` for the DWM
# theme, `window_state.rs` for WINDOWPLACEMENT).
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
futures-lite = "=2.6.1"
# The store and its contract are crates of Knowqore's workspace, taken from
# one commit; Cargo finds each by its name.
knowqore-store-scheda = { git = "https://github.com/sonalect/knowqore", rev = "99b510c9476725a4df0e8cbde5917e134117f94b" }
knowqore-stores = { git = "https://github.com/sonalect/knowqore", rev = "99b510c9476725a4df0e8cbde5917e134117f94b", features = [
    "tokio",
] }
mimalloc = { git = "https://github.com/amsokol/mimalloc", tag = "v3.5.3+1", features = ["override"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-opener = "=2.7.2"

[target.'cfg(not(windows))'.dependencies]
mundy = { version = "=0.2.3", default-features = false, features = [
    "accent-color",
    "async-io",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Held at Tauri's gtk 0.18: only one gtk-sys may link the native gtk-3, so
# gtk 0.19 waits until Tauri moves.
gtk = "=0.18.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
